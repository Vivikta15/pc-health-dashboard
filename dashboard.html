<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Health</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/icon-64.png">
<link rel="icon" type="image/png" sizes="128x128" href="/assets/icon-128.png">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/icon-256.png">
<link rel="apple-touch-icon" href="/assets/icon-256.png">
<style>
:root{
  /* default = "Vitals" look; themes overwrite these from JS */
  --bg:#121214;--top:#18181b;--card:#1a1a1e;--inset:#111113;--line:#27272d;--fg:#f3f4f7;--mut:#9a9aa6;--dim:#5f5f6b;
  --tab:#1d1d22;--tabon:#1d3a66;--tabonfg:#7db1ff;
  --cpu:#3b82f6;--mem:#8f7cf5;--gpu:#ec4899;--disk:#f59e0b;--net:#22c55e;--bat:#22c55e;--npu:#8b5cf6;--hl:#14b8a6;
  --ok:#34d399;--warn:#fbbf24;--bad:#fb5d6c;
  --fd:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--blur:0px;--bgimg:none;--shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --thr:var(--disk);--snd:var(--gpu);--bt:var(--cpu);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bgimg) center/cover fixed,var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--tabonfg);outline-offset:2px;border-radius:10px}
svg{display:block}.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--top);border-bottom:1px solid var(--line);backdrop-filter:blur(var(--blur))}
.logo{width:32px;height:32px;flex:none;display:block}
.tabs{display:flex;gap:2px;background:var(--tab);padding:5px;border-radius:16px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;color:var(--mut);font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{background:color-mix(in srgb,var(--tc,var(--tabonfg)) 20%,var(--tab));color:var(--tc,var(--tabonfg))}
.sp{flex:0 0 0}
@media (max-width:1560px){.tabs button:not([aria-selected=true]) .l{display:none}.tabs button{padding:8px 11px}}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:var(--tab);color:var(--mut);font-size:12.5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.ib{width:38px;height:38px;border-radius:11px;background:var(--tab);display:grid;place-items:center;color:var(--mut);position:relative}
.ib:hover{color:var(--fg)}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.themebtn{display:grid;grid-template-columns:repeat(2,8px);gap:4px}
.themebtn i{width:8px;height:8px;border-radius:50%}

/* layout */
#view{max-width:1360px;margin:0 auto;padding:16px 18px 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7,.c8{grid-column:span 12}}
@media (max-width:700px){.c3,.c4,.c6{grid-column:span 12}}

.card{background:var(--card);border-radius:20px;padding:16px 18px;position:relative;min-width:0;box-shadow:var(--shadow);backdrop-filter:blur(var(--blur));border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.card header{display:flex;align-items:center;gap:10px}
.card header b{color:var(--c,var(--fg));font-size:15px;font-weight:650;font-family:var(--fd)}
.chip{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--mut)) 18%,transparent);color:var(--c,var(--mut))}
.chev{margin-left:auto;color:var(--dim);font-style:normal;font-size:18px}
.mini{cursor:pointer;transition:transform .15s,border-color .15s}
.mini:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.subt{color:var(--mut);margin-top:12px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-family:var(--fd);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:2px;display:flex;align-items:baseline;gap:6px}
.big small{font-size:18px;font-weight:500;color:var(--mut);letter-spacing:0}
.badge{margin-left:auto;font-style:normal;font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);align-self:center}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tri span{display:block;color:var(--mut);font-size:12.5px}.tri b{font-size:14.5px;font-weight:650;white-space:nowrap}
.inset{background:var(--inset);border-radius:13px;padding:9px 10px;margin-top:14px}
.bars{display:block;width:100%;height:44px}
.bars.tall{height:170px}
.note{color:var(--dim);font-size:12.5px;padding:6px 2px}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:2px 0 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}
.kv span{color:var(--mut)}.kv b{font-weight:650;text-align:right}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.lg i{width:9px;height:9px;border-radius:50%}.lg span{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lg b{color:var(--mut);font-weight:500}
.donutbox{display:flex;align-items:center;gap:16px;margin-top:8px}
.donut{width:130px;height:130px;flex:none}
.dn{font:700 17px var(--fd);fill:var(--fg)}.ds{font:500 8.5px "Segoe UI",sans-serif;fill:var(--mut)}
.legend{flex:1;min-width:0}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:8px;margin-top:10px}
.core{height:84px;border-radius:8px;background:var(--inset);position:relative;overflow:hidden}
.core i{position:absolute;left:0;right:0;bottom:0;background:var(--cpu);opacity:.9;border-radius:0 0 8px 8px;transition:height .5s}
.core em{position:absolute;top:4px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;color:var(--mut)}
.list .it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}.list .it .d{color:var(--mut);font-size:12.5px}
.app{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;padding:7px 0}
.app img,.app .av{width:24px;height:24px;border-radius:6px;object-fit:contain}
.app .av{display:grid;place-items:center;background:var(--inset);color:var(--mut);font-weight:700;font-size:11px}
.app .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .meter{height:4px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}.app .meter i{display:block;height:100%;background:var(--c,var(--mem));border-radius:9px}
.app .m{font-weight:600;min-width:62px;text-align:right}.app .c{color:var(--mut);min-width:44px;text-align:right}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--tab);font-weight:600;font-size:13px;transition:.15s;border:1px solid var(--line)}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--tabonfg);color:var(--bg);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--inset);border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.seg button{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--tab);color:var(--fg)}
.shield{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.shield svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shield.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.shield.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.shield.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;width:35%;border-radius:9px;background:linear-gradient(90deg,transparent,var(--ok),transparent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:105%}}
.skel{border-radius:10px;height:120px;background:linear-gradient(90deg,var(--inset),var(--line),var(--inset));background-size:200% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-200% 0}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:var(--inset);border-radius:13px;padding:11px 13px}.tile span{display:block;color:var(--mut);font-size:12px}.tile b{font-family:var(--fd);font-size:20px}
.file{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.file:last-child{border-bottom:0}
.file .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file .pth{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.bar{height:8px;border-radius:99px;background:var(--inset);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--disk))}
.hide{display:none!important}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.crumb{padding:4px 8px;border-radius:8px;color:var(--mut);font-weight:600;font-size:13px}.crumb:hover{background:var(--inset);color:var(--fg)}.crumb:last-of-type{color:var(--fg)}
.sepc{color:var(--dim);font-style:normal}
.mrow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(60px,1fr) 88px auto;gap:12px;align-items:center;padding:9px 6px;border-radius:12px}
.mrow.dir{cursor:pointer}.mrow.dir:hover{background:var(--inset)}
.mn{display:flex;gap:10px;align-items:center;min-width:0}.mn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mn .sm{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{flex:none;min-width:92px;text-align:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.mb{height:8px;border-radius:99px;background:var(--inset);overflow:hidden}.mb i{display:block;height:100%;border-radius:99px;transition:width .5s}
.msz{text-align:right}.meas{color:var(--dim);font-weight:500;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.4}}
.chev2{font-style:normal;color:var(--dim);margin-left:6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.crow .d{color:var(--mut);font-size:12.5px;margin-top:2px}.crow .d i{font-style:normal;color:var(--dim)}
.rk{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:1px}
.rk.safe{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.rk.recreatable{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.rk.permanent{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.warnbox{margin-top:10px;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-weight:600;font-size:13px}
.inp{width:96px;padding:7px 10px;border-radius:9px;background:var(--inset);border:1px solid var(--line);color:var(--fg);font:inherit}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:900px){.mrow{grid-template-columns:minmax(0,1fr) 88px auto}.mb{display:none}}

/* theme popover */
.pop{position:fixed;top:62px;right:18px;z-index:40;width:min(480px,calc(100vw - 24px));background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 24px 60px -10px rgba(0,0,0,.55)}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--mut);font-size:13px}
.th .pv{width:100%;aspect-ratio:1.45;border-radius:13px;padding:10px 11px;border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.th .pv b{font:600 22px var(--pf);line-height:1}
.th .pv span{display:flex;gap:4px;align-items:flex-end;height:18px}.th .pv span i{width:7px;border-radius:2px}
.th[aria-pressed=true] .pv{border-color:#3b82f6}.th[aria-pressed=true]{color:var(--fg);font-weight:700}
.wp{margin-top:10px;display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;border:2px solid var(--line);text-align:left}
.wp[aria-pressed=true]{border-color:#3b82f6}
.wp .thumb{width:84px;height:48px;border-radius:9px;background:linear-gradient(135deg,#888,#444) center/cover;flex:none}
.wp b{display:block}.wp span{color:var(--mut);font-size:12.5px}
.pdesc{margin-top:12px;color:var(--mut);font-size:13.5px}.pdesc b{color:var(--fg)}

.veil{position:fixed;inset:0;background:rgba(5,8,14,.62);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px}
.modal{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.modal h2{margin:0 0 6px;font-size:20px}.modal .lead{color:var(--mut);margin:0 0 14px}.modal label{display:flex;gap:10px;align-items:center;margin:14px 0 4px;cursor:pointer}.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--tab);border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-weight:600;transition:.3s;z-index:60;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>
/* apply the saved theme before first paint */
try{var _t=localStorage.getItem('pch-theme-vars');if(_t){var _v=JSON.parse(_t);for(var k in _v)document.documentElement.style.setProperty(k,_v[k]);}}catch(e){}
</script>
</head>
<body>
<div class="top">
  <img class="logo" src="/assets/icon-64.png" alt="PC Health" width="32" height="32">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <div style="flex:1"></div>
  <span class="pill" id="upPill"><span class="dot" id="liveDot"></span><span id="upTxt">—</span></span>
  <button class="ib" id="refreshBtn" title="Re-run all checks" aria-label="Re-run all checks"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
  <button class="ib" id="themeBtn" title="Change theme" aria-label="Change theme" aria-haspopup="true"><span class="themebtn"><i style="background:var(--cpu)"></i><i style="background:var(--mem)"></i><i style="background:var(--disk)"></i><i style="background:var(--net)"></i></span></button>
</div>

<div class="pop hide" id="pop" role="dialog" aria-label="Theme">
  <div class="tg" id="tg"></div>
  <button class="wp" id="wpBtn" aria-pressed="false"><span class="thumb" id="wpThumb"></span><span><b>Match my wallpaper</b><span>Uses the colors and mood of your desktop background.</span></span></button>
  <div class="pdesc" id="pdesc"></div>
</div>

<main id="view"></main>

<div class="veil hide" id="cleanVeil" role="dialog" aria-modal="true" aria-labelledby="cleanTitle">
  <div class="modal"><h2 id="cleanTitle">Clean up?</h2>
    <div id="cleanBody"></div>
    <div class="acts"><button class="btn" id="cleanNo">Cancel</button><button class="btn primary" id="cleanYes">Clean</button></div></div>
</div>
<div class="veil hide" id="offVeil"><div class="modal"><h2>Connection lost</h2><p class="lead">The dashboard stopped running in the background (this can happen after your laptop sleeps). Close this window and open <b>PC Health</b> again from your taskbar or desktop.</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TOKEN='__TOKEN__';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,body){const o={headers:{'X-Token':TOKEN,'Content-Type':'application/json'}};if(body!==undefined){o.method='POST';o.body=JSON.stringify(body);}const r=await fetch(p,o);if(!r.ok)throw new Error(r.status);return r.json();}
const setT=(id,t)=>{const e=document.getElementById(id);if(e&&e.textContent!==String(t))e.textContent=t;};
const setH=(id,h)=>{const e=document.getElementById(id);if(e)e.innerHTML=h;};

/* ================= formatting ================= */
const fmtBytes=(b,d=1)=>{b=+b||0;const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++;}return (i>=3?b.toFixed(d):i>=1?b.toFixed(i===1?0:d):b.toFixed(0))+' '+u[i];};
const rateP=b=>{b=+b||0;const u=['B/s','kB/s','MB/s','GB/s'];let i=0;while(b>=1000&&i<3){b/=1000;i++;}return {v:(b>=100||i===0?Math.round(b):b.toFixed(1)).toString(),u:u[i]};};
const rate=b=>{const r=rateP(b);return r.v+' '+r.u;};
const fmtDur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;};
const FR={chrome:'Google Chrome',msedge:'Microsoft Edge',msedgewebview2:'Edge WebView (inside apps)',svchost:'Windows background services',explorer:'File Explorer',code:'VS Code',claude:'Claude',system:'Windows System',dwm:'Desktop Window Manager',msmpeng:'Windows Defender','memory compression':'Memory Compression',searchhost:'Windows Search','wispr flow':'Wispr Flow',powershell:'PowerShell',node:'Node.js',onedrive:'OneDrive',spotify:'Spotify',slack:'Slack',zoom:'Zoom',whatsapp:'WhatsApp',winword:'Word',excel:'Excel',powerpnt:'PowerPoint',outlook:'Outlook',notion:'Notion',discord:'Discord',firefox:'Firefox'};
const friendly=n=>FR[n.toLowerCase()]||n.replace(/[-_.]+/g,' ').replace(/^\w/,c=>c.toUpperCase());
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';

/* ================= icons / tabs ================= */
const IC={
overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
memory:'<rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 11v2M10 11v2M14 11v2M18 11v2M6 17v2M18 17v2"/>',
disk:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h.01M11 15h6"/>',
network:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
gpu:'<path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/>',
neural:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',

function bars(id,data,max,color,n=48){
  const c=typeof id==='string'?document.getElementById(id):id;if(!c)return;
  const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const gap=Math.max(1.5,w/n*.3),bw=(w-gap*(n-1))/n,d=data.slice(-n),off=n-d.length;
  for(let i=0;i<n;i++){
    const v=i<off?null:d[i-off],x=i*(bw+gap),bh=v==null?2:Math.max(2,Math.min(v,max)/max*(h-2));
    g.globalAlpha=v==null?.22:1;
    const gr=g.createLinearGradient(0,h-bh,0,h);gr.addColorStop(0,color);gr.addColorStop(1,color+'a0');g.fillStyle=gr;
    g.beginPath();if(g.roundRect)g.roundRect(x,h-bh,bw,bh,Math.min(2,bw/2));else g.rect(x,h-bh,bw,bh);g.fill();
  }
  g.globalAlpha=1;
}
function donut(segs,top,sub){
  const R=44,C=2*Math.PI*R,tot=segs.reduce((a,s)=>a+Math.max(0,s.v),0)||1;let off=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{const len=s.v/tot*C,vis=Math.max(0,len-2.5);const a=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${vis.toFixed(1)} ${(C-vis).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;off+=len;return a;}).join('');
  return `<svg viewBox="0 0 120 120" class="donut"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--inset)" stroke-width="14"/>${arcs}<text x="60" y="60" text-anchor="middle" class="dn">${top}</text><text x="60" y="75" text-anchor="middle" class="ds">${sub}</text></svg>`;
}

function renderCleanup(){

  if(!CL){setHIf('sClean','<div class="skel"></div><div class="note">Looking for things that are safe to clean up…</div>');return;}
  const run=ST&&ST.clean&&ST.clean.state==='running',rid=run?ST.clean.id:null;
  const btn=(id,needsAdmin)=>`<button class="btn sm" data-clean="${id}" ${run||needsAdmin?'disabled':''}>${rid===id?'Cleaning…':needsAdmin?'Needs admin':'Clean'}</button>`;
  const items=CL.items.map(i=>`<div class="crow"><div style="min-width:0"><b>${esc(i.name)}</b><span class="rk ${i.risk}">${RISK[i.risk]}</span><div class="d">${esc(i.what)} <i>If removed: ${esc(i.ifGone)}</i></div></div><b class="num">${i.needsAdmin?'—':fmtBytes(i.bytes)}</b>${btn(i.id,i.needsAdmin)}</div>`).join('');
  const nm=CL.nm.filter(n=>n.bytes>=5e6).map((n,idx)=>{const parent=n.path.replace(/\\node_modules$/,''),proj=parent.split('\\').pop();return `<div class="crow"><div style="min-width:0"><b>${esc(proj)}</b><span class="rk recreatable">Rebuilds with npm install</span><div class="d" title="${esc(parent)}">${esc(parent)} <i>· last worked on ${n.days} days ago</i></div></div><b class="num">${fmtBytes(n.bytes)}</b>${btn('nm:'+CL.nm.indexOf(n),false)}</div>`;}).join('');
  const sum=CL.items.filter(i=>!i.needsAdmin&&i.risk!=='permanent').reduce((a,i)=>a+i.bytes,0);
  setHIf('sClean',`<div class="note" style="padding:0 0 4px">Each item is cleaned on its own, after you confirm. There is no "clean everything" button. Anything that belongs to Windows is left alone.</div>
   ${items?`<div class="sec" style="margin-top:8px">Caches and leftovers · up to ${fmtBytes(sum)}</div>${items}`:'<div class="note">Nothing worth cleaning right now.</div>'}
   ${nm?`<div class="sec" style="margin-top:16px">Old developer packages (node_modules)</div>${nm}`:''}`);
}
function askClean(id){
  let title,body,size;
  if(id.startsWith('nm:')){const n=CL&&CL.nm[+id.slice(3)];if(!n)return;const parent=n.path.replace(/\\node_modules$/,'');size=n.bytes;title='Delete this node_modules folder?';
    body=`<p class="lead">This holds downloaded developer packages for the project at <b>${esc(parent)}</b>. Running <b>npm install</b> in that project brings them back. Last worked on ${n.days} days ago.</p><p class="note">It is deleted permanently, not sent to the Recycle Bin.</p>`;}
  else{const i=CL&&CL.items.find(x=>x.id===id);if(!i)return;size=i.bytes;title=`Clean ${i.name}?`;body=`<p class="lead"><b>What it is:</b> ${esc(i.what)}</p><p class="lead"><b>If you remove it:</b> ${esc(i.ifGone)}</p>`+(i.risk==='permanent'?'<p class="note" style="color:var(--bad)">This cannot be undone.</p>':'');}
  $('#cleanTitle').textContent=title;$('#cleanBody').innerHTML=body+`<div class="kv"><span>You'll free about</span><b class="num">${fmtBytes(size)}</b></div>`;askId=id;$('#cleanVeil').classList.remove('hide');$('#cleanYes').focus();
}
function renderFiles(){
  const o=ST&&ST.storage;if(!o||!document.getElementById('sFiles'))return;const list=fileTab==='large'?o.large:o.oldTop;
  const files=(list||[]).slice(0,6).map(f=>{const p=f.Path||'',i=Math.max(p.lastIndexOf('\\'),p.lastIndexOf('/'));return `<div class="file"><div style="min-width:0"><div class="nm" title="${esc(p)}">${esc(p.slice(i+1))}</div><div class="pth" title="${esc(p)}">&lrm;${esc(p.slice(0,i))}</div></div><b class="num">${fmtBytes(f.Bytes)}</b><button class="btn sm" data-reveal="${esc(p)}">Show</button></div>`;}).join('')||'<div class="note">Nothing big found.</div>';
  setHIf('sFiles',`<div style="display:flex;align-items:center;margin:0 0 4px;gap:10px;flex-wrap:wrap"><span class="note" style="padding:0">Your call: nothing here is deleted for you. Click Show, then delete in File Explorer.</span><span class="seg"><button data-tab2="large" aria-pressed="${fileTab==='large'}">Biggest files</button><button data-tab2="old" aria-pressed="${fileTab==='old'}">Old downloads (${fmtBytes(o.oldBytes)})</button></span></div>${files}`);
}
function enterStorage(){if(MAP.data&&MAP.data.state==='ready')renderMap();else fetchMap();fetchCleanup();}
function renderDriveHealth(){const dh=(ST&&ST.driveHealth)||[];setHIf('dhealth',dh.length?dh.map(d=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="kv" style="border:0;padding:0"><span><b style="color:var(--fg)">${esc(d.name)}</b></span><b style="color:${d.health==='Healthy'?'var(--ok)':'var(--bad)'}">${esc(d.health)}</b></div><div class="note" style="padding:2px 0">${esc(d.type)} · ${esc(d.bus)} · ${fmtBytes(d.sizeBytes,0)}${d.wear!=null?' · wear '+d.wear+'%':''}${d.tempC!=null?' · '+d.tempC+' °C':''}</div></div>`).join('')+(dh[0].wear==null?'<div class="note">Wear and temperature need administrator permission.</div>':''):'<div class="note">Checking drives…</div>');}

/* ================= routing / loops ================= */
function go(tab){cur=tab;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  Object.keys(_hc).forEach(k=>delete _hc[k]);SUMKEY='';
  $('#view').innerHTML=V[tab].html();render();if(tab==='storage')enterStorage();try{sessionStorage.setItem('pch-tab',tab);}catch(e){}}
function render(){try{V[cur].update();}catch(e){console.error(e);}}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab);});

let fails=0;
async function tickLive(){
  try{L=await api('/api/live');fails=0;$('#liveDot').className='dot ok';$('#offVeil').classList.add('hide');
    push('cpu',L.cpu.pct);push('mem',L.mem.pct);push('disk',L.disk.readBps+L.disk.writeBps);push('rx',L.net.rxBps);push('tx',L.net.txBps);push('freq',L.cpu.freqMHz);if(L.gpu&&L.gpu.ok)push('gpu',L.gpu.util);if(L.battery)push('bat',L.battery.pct);
    setT('upTxt','Up '+fmtDur(L.uptimeSec));render();}
  catch(e){fails++;$('#liveDot').className='dot bad';if(fails>=4)$('#offVeil').classList.remove('hide');}
  setTimeout(tickLive,2000);
}
let pollT,prevClean='idle';
async function pollStatus(){
  clearTimeout(pollT);
  try{ST=await api('/api/status');const busy=ST.busy.health||ST.busy.security||ST.busy.storage||(ST.scan&&ST.scan.state==='running')||(ST.clean&&ST.clean.state==='running');
    if(ST.clean&&ST.clean.state!==prevClean){if(ST.clean.state==='done'&&prevClean==='running'){toast('Freed '+fmtBytes(ST.clean.freed),'ok');CL=null;MAP.data=null;delete _hc.sClean;if(cur==='storage'){fetchCleanup();fetchMap(true);}}if(ST.clean.state==='error')toast('Cleanup stopped: '+ST.clean.msg,'bad');prevClean=ST.clean.state;}
    $('#refreshBtn').classList.toggle('spin',!!busy);$('#refreshBtn').disabled=!!busy;render();pollT=setTimeout(pollStatus,busy?1500:8000);}
  catch(e){pollT=setTimeout(pollStatus,3000);}
}
async function pollDevices(){try{const d=await api('/api/devices');if(!d.pending)DV=d;render();}catch(e){}setTimeout(pollDevices,DV?30000:4000);}

/* ================= actions ================= */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('button')){go(g.dataset.go);return;}
  const t=e.target.closest('[data-act],[data-reveal],[data-tab2],[data-map],[data-clean]');if(!t)return;
  if(t.dataset.act==='scan'){try{await api('/api/scan',{});toast('Scan started','ok');pollStatus();}catch{toast('Could not start the scan','bad');}}
  else if(t.dataset.act==='gostorage')go('storage');
  else if(t.dataset.act==='remap')mapGo(MAP.path,true);
  else if(t.dataset.act==='maptoggle'){MAP.all=!MAP.all;renderMap();}
  else if(t.dataset.clean)askClean(t.dataset.clean);
  else if(t.dataset.map)mapGo(t.dataset.map);
  else if(t.dataset.reveal){try{const r=await api('/api/reveal',{path:t.dataset.reveal});if(!r.ok)toast('Could not open that folder','bad');}catch{toast('Could not open that folder','bad');}}
  else if(t.dataset.tab2){fileTab=t.dataset.tab2;delete _hc.sFiles;renderFiles();}
  if(!e.target.closest('#pop,#themeBtn'))$('#pop').classList.add('hide');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#cleanVeil').classList.add('hide');$('#pop').classList.add('hide');}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.mini')){e.preventDefault();go(e.target.dataset.go);}});
document.addEventListener('change',e=>{if(e.target.id==='limitIn'){const v=Math.max(0,parseFloat(e.target.value)||0);try{localStorage.setItem('pch-limit-gb',String(v));}catch(x){}SUMKEY='';e.target.blur();renderSummary();toast(v?`You'll be warned below ${v} GB free`:'Free-space warning turned off','ok');}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.mrow.dir')){mapGo(e.target.dataset.map);}});
$('#cleanNo').onclick=()=>{askId=null;$('#cleanVeil').classList.add('hide');};
$('#cleanVeil').addEventListener('click',e=>{if(e.target.id==='cleanVeil')$('#cleanVeil').classList.add('hide');});
$('#cleanYes').onclick=async()=>{const id=askId;$('#cleanVeil').classList.add('hide');if(!id)return;try{const r=await api('/api/clean',{id});if(!r.ok)throw 0;prevClean='running';pollStatus();}catch{toast('Could not start that cleanup','bad');}};
$('#refreshBtn').onclick=async()=>{try{await api('/api/refresh',{});toast('Re-checking…','ok');pollStatus();}catch{}};
let toastT;function toast(msg,kind){const t=$('#toast');t.innerHTML=esc(msg);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600);}

  try{localStorage.setItem('pch-theme',name);localStorage.setItem('pch-theme-vars',JSON.stringify(v));}catch(e){}

/* ----- wallpaper theme ----- */
const hex=(r,g,b)=>'#'+[r,g,b].map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');
function hsl2hex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return hex(f(0)*255,f(8)*255,f(4)*255);}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s*100,l*100];}
async function wallpaperTheme(){
  const img=new Image();img.src='/wallpaper?t='+TOKEN+'&v='+Date.now();await img.decode();
  const W=64,Hh2=36,c=document.createElement('canvas');c.width=W;c.height=Hh2;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,W,Hh2);const d=g.getImageData(0,0,W,Hh2).data;
  let R=0,G=0,B=0,n=0;const buckets=Array.from({length:12},()=>({w:0,h:0,s:0,l:0,n:0}));
  for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;const [h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]);if(s<14||l<12||l>92)continue;const b=buckets[Math.floor(h/30)%12],w=(s/100)*(1-Math.abs(l-50)/60);b.w+=w;b.h+=h*w;b.s+=s*w;b.l+=l*w;b.n++;}
  const [H0,S0,L0]=rgb2hsl(R/n,G/n,B/n),light=L0>58;
  const top=buckets.filter(b=>b.w>0).sort((a,b)=>b.w-a.w).slice(0,4).map(b=>b.h/b.w);
  const base=top.length?top:[H0,H0+40,H0+80,H0+120];while(base.length<4)base.push(base[base.length-1]+35);
  const sat=Math.max(48,Math.min(80,S0+35)),lum=light?38:64;
  const a=base.map(h=>hsl2hex(h,sat,lum));const more=[hsl2hex(base[0]+28,sat,lum),hsl2hex(base[1]-28,sat,lum),hsl2hex(base[2]+28,sat,lum),hsl2hex(base[3]-28,sat,lum)];
  const hb=H0;
  const v=light?{'--bg':hsl2hex(hb,22,90),'--top':'rgba(255,255,255,.55)','--card':'rgba(255,255,255,.62)','--inset':'rgba(255,255,255,.55)','--line':'rgba(0,0,0,.09)','--fg':hsl2hex(hb,30,14),'--mut':hsl2hex(hb,15,36),'--dim':hsl2hex(hb,10,56),'--tab':'rgba(255,255,255,.55)','--tabon':hsl2hex(base[0],45,88),'--tabonfg':hsl2hex(base[0],55,30),'--ok':'#1f8a55','--warn':'#b0730d','--bad':'#c23a3a','--bgimg':'linear-gradient(rgba(250,246,238,.55),rgba(250,246,238,.7)),url(/wallpaper?t='+TOKEN+'&v='+Date.now()+')'}
   :{'--bg':hsl2hex(hb,30,7),'--top':'rgba(10,10,14,.55)','--card':'rgba(18,18,24,.58)','--inset':'rgba(0,0,0,.35)','--line':'rgba(255,255,255,.1)','--fg':'#f4f5f8','--mut':'#b4b8c4','--dim':'#7b8090','--tab':'rgba(255,255,255,.07)','--tabon':hsl2hex(base[0],40,24),'--tabonfg':hsl2hex(base[0],80,74),'--bgimg':'linear-gradient(rgba(6,6,10,.55),rgba(6,6,10,.72)),url(/wallpaper?t='+TOKEN+'&v='+Date.now()+')'};
  Object.assign(v,{'--cpu':a[0],'--mem':a[1],'--gpu':a[2],'--disk':a[3],'--net':more[0],'--bat':more[1],'--npu':more[2],'--hl':more[3],'--blur':'18px','--shadow':'0 8px 30px -12px rgba(0,0,0,.35)'});
  if(light)v['--fd']=SERIF;return {v,img:img.src};
}
async function setWallpaperTheme(){try{const {v,img}=await wallpaperTheme();applyVars(v,'wallpaper');$('#wpThumb').style.backgroundImage=`url(${img})`;lastWp=Date.now();}catch(e){toast("Couldn't read your wallpaper — using Vitals","bad");applyVars(THEMES.vitals.v,'vitals');}}
window.addEventListener('focus',()=>{if(themeName==='wallpaper'&&Date.now()-lastWp>60000)setWallpaperTheme();});
window.addEventListener('resize',()=>render());

/* ================= start ================= */
(function init(){
  let saved='vitals';try{saved=localStorage.getItem('pch-theme')||'vitals';}catch(e){}
  if(saved==='wallpaper')setWallpaperTheme();else if(THEMES[saved])setTheme(saved);else setTheme('vitals');
  let t='overview';try{t=sessionStorage.getItem('pch-tab')||'overview';}catch(e){}
  const hp=new URLSearchParams(location.hash.slice(1));   // optional deep link, e.g. #tab=storage&theme=paper
  if(hp.get('theme')&&THEMES[hp.get('theme')])setTheme(hp.get('theme'));
  if(hp.get('tab'))t=hp.get('tab');
  go(V[t]?t:'overview');
  tickLive();pollStatus();pollDevices();
})();
